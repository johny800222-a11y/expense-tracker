<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>群萱記帳本</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="glow-orb"></div>

<!-- ── 頂部 ── -->
<header>
  <div class="header-inner">
    <h1>💰 群萱記帳本</h1>
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <span id="monthLabel"></span>
      <button id="nextMonth">›</button>
    </div>
  </div>
</header>

<!-- ── 總覽卡片 ── -->
<section class="cards">
  <div class="card card-total">
    <div class="card-label">本月總花費</div>
    <div class="card-amount" id="totalAmount">$0</div>
  </div>
  <div class="card card-qun">
    <div class="card-label">👤 群</div>
    <div class="card-amount" id="qunAmount">$0</div>
  </div>
  <div class="card card-xuan">
    <div class="card-label">👤 萱</div>
    <div class="card-amount" id="xuanAmount">$0</div>
  </div>
</section>

<!-- ── 圖表區 ── -->
<section class="charts">
  <div class="chart-box">
    <h2>分類花銷</h2>
    <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
  </div>
  <div class="chart-box">
    <h2>群 vs 萱</h2>
    <div class="chart-wrap"><canvas id="personChart"></canvas></div>
  </div>
  <div class="chart-box chart-wide">
    <h2>每日花費趨勢</h2>
    <canvas id="dailyChart" style="max-height:180px"></canvas>
  </div>
</section>

<!-- ── 功能列 ── -->
<section class="toolbar">
  <div class="filter-group">
    <select id="filterPerson">
      <option value="">全部人員</option>
      <option value="群">群</option>
      <option value="萱">萱</option>
    </select>
    <select id="filterCategory">
      <option value="">全部分類</option>
      <option>餐飲</option><option>交通</option><option>購物</option>
      <option>日用品</option><option>娛樂</option><option>醫療</option>
      <option>店務</option><option>教育費</option><option>貸款</option><option>其他</option>
    </select>
  </div>
  <div class="action-group">
    <button class="btn btn-sync" id="syncInvoiceBtn">☁️ 同步發票</button>
    <button class="btn btn-carrier" id="openCarrierBtn">📱 載具條碼</button>
    <button class="btn btn-add" id="openModalBtn">＋ 新增花費</button>
  </div>
</section>

<!-- ── 明細列表 ── -->
<section class="expense-list">
  <div id="expenseRows"></div>
</section>

<!-- ── 新增/編輯 Modal ── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">新增花費</h2>
    <form id="expenseForm">
      <input type="hidden" id="editId" />
      <div class="form-grid">
        <label>花費人
          <select id="fPerson" required>
            <option value="群">群</option>
            <option value="萱">萱</option>
          </select>
        </label>
        <label>日期
          <input type="date" id="fDate" required />
        </label>
        <label>分類
          <select id="fCategory">
            <option>餐飲</option><option>交通</option><option>購物</option>
            <option>日用品</option><option>娛樂</option><option>醫療</option>
            <option>店務</option><option>教育費</option><option>貸款</option><option>其他</option>
          </select>
        </label>
        <label>金額 (NT$)
          <input type="number" id="fAmount" min="1" required placeholder="0" />
        </label>
        <label class="full-width">描述
          <input type="text" id="fDescription" placeholder="例：麥當勞早餐" />
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-cancel" id="cancelModalBtn">取消</button>
        <button type="submit" class="btn btn-save">儲存</button>
      </div>
    </form>
  </div>
</div>

<!-- ── 匯入發票 Modal ── -->
<div class="modal-overlay" id="syncModalOverlay">
  <div class="modal" style="max-width:600px">
    <h2>☁️ 匯入電子發票 CSV</h2>
    <div id="csvUploadArea">
      <p style="color:#888;font-size:.88rem;margin-bottom:1rem">
        至 <strong style="color:var(--total)">einvoice.nat.gov.tw</strong> 下載載具 CSV，再上傳至此匯入
      </p>
      <div class="form-grid">
        <label class="full-width">花費人
          <select id="syncPerson">
            <option value="群">群</option>
            <option value="萱">萱</option>
            <option value="共同">共同（各佔一半）</option>
          </select>
        </label>
        <label class="full-width" id="csvDropLabel" style="cursor:pointer">
          <div id="csvDropZone">
            <div style="font-size:2rem;margin-bottom:.5rem">📂</div>
            <div style="font-size:.9rem;color:var(--muted)">點擊或拖曳 CSV 檔案至此</div>
          </div>
          <input type="file" id="csvFileInput" accept=".csv" style="display:none" />
        </label>
      </div>
    </div>

    <!-- 預覽區 -->
    <div id="csvPreviewArea" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">
        <span id="csvPreviewTitle" style="font-size:.88rem;color:var(--muted)"></span>
        <button type="button" class="btn btn-cancel" id="csvResetBtn" style="font-size:.78rem;padding:.3rem .7rem">重新選擇</button>
      </div>
      <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:10px">
        <table id="csvPreviewTable" style="width:100%;border-collapse:collapse;font-size:.8rem">
          <thead>
            <tr style="background:rgba(255,255,255,.05);position:sticky;top:0">
              <th style="padding:.5rem .7rem;text-align:left;color:var(--muted)">日期</th>
              <th style="padding:.5rem .7rem;text-align:left;color:var(--muted)">商家</th>
              <th style="padding:.5rem .7rem;text-align:left;color:var(--muted)">分類</th>
              <th style="padding:.5rem .7rem;text-align:right;color:var(--muted)">金額</th>
              <th style="padding:.5rem .7rem;text-align:center;color:var(--muted)">匯入</th>
            </tr>
          </thead>
          <tbody id="csvPreviewBody"></tbody>
        </table>
      </div>
    </div>

    <div class="form-actions" style="margin-top:1rem">
      <button type="button" class="btn btn-cancel" id="cancelSyncBtn">取消</button>
      <button type="button" class="btn btn-save" id="doSyncBtn" style="display:none">匯入選取發票</button>
    </div>
  </div>
</div>

<!-- ── 載具條碼 Modal ── -->
<div class="modal-overlay" id="carrierModalOverlay">
  <div class="modal" style="text-align:center">
    <h2>📱 個人載具條碼</h2>
    <p style="color:#888;font-size:.85rem;margin-bottom:1.2rem">結帳時出示此條碼，發票自動存入載具</p>
    <div style="background:#fff;border-radius:12px;padding:1.2rem;display:inline-block;margin-bottom:1rem">
      <svg id="carrierBarcode"></svg>
      <div style="color:#333;font-size:1rem;font-weight:700;margin-top:.5rem;letter-spacing:.1em">/I+OBSTR</div>
    </div>
    <div style="color:var(--muted);font-size:.78rem;margin-bottom:1.2rem">群 & 萱 共用載具</div>
    <div class="form-actions" style="justify-content:center">
      <button type="button" class="btn btn-cancel" id="cancelCarrierBtn">關閉</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
